<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --texto: #ffffff;
            --subtexto: #a0a0a0;
            --acento: #a333ff;
        }

        body.tema-azul { --acento: #007bff; }
        body.tema-rojo { --acento: #ff3b3b; }
        body.tema-amarillo { --acento: #ffcc00; }
        body.tema-morado { --acento: #a333ff; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo);
            color: var(--texto); transition: 0.3s; overflow-x: hidden;
        }

        /* Pantalla de Entrada para forzar el sonido */
        #entry-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--fondo); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-entry {
            padding: 20px 50px; background: var(--acento); color: white;
            border: none; border-radius: 50px; font-weight: 800; cursor: pointer;
            font-size: 1.2rem; box-shadow: 0 0 20px var(--acento); transition: 0.3s;
        }
        .btn-entry:hover { transform: scale(1.1); box-shadow: 0 0 40px var(--acento); }

        header {
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); transition: 0.3s; }

        .nav-right { display: flex; align-items: center; gap: 20px; }

        .selector-box { 
            display: flex; gap: 15px; align-items: center; 
            background: #111; padding: 6px 15px; border-radius: 50px; 
            border: 1px solid #222; 
        }
        
        .lang-picker { 
            background: transparent; color: var(--subtexto); border: none; 
            font-size: 0.75rem; font-weight: 700; cursor: pointer; outline: none; 
        }

        .color-dots { display: flex; gap: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .dot:hover { transform: scale(1.3); }
        .d-morado { background: #a333ff; }
        .d-azul { background: #007bff; }
        .d-rojo { background: #ff3b3b; }
        .d-amarillo { background: #ffcc00; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--subtexto); text-decoration: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .nav-links a:hover { color: var(--acento); }

        .discord-btn { 
            background: #5865F2; padding: 8px; border-radius: 10px; 
            display: flex; align-items: center; transition: 0.3s; 
        }

        .container { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #welcome-screen { text-align: center; }
        .avatar-glow {
            width: 140px; height: 140px; border-radius: 50%;
            border: 4px solid var(--acento); object-fit: cover;
            box-shadow: 0 0 35px var(--acento);
            margin-bottom: 25px; transition: 0.4s ease;
        }
        .welcome-text { font-size: 3.5rem; font-weight: 800; margin: 0; text-transform: uppercase; }
        .welcome-text span { color: var(--acento); transition: 0.3s; }
        .status-msg { color: #5865F2; font-weight: bold; margin-top: 15px; letter-spacing: 1px; }

        .auth-card { background: var(--tarjeta); padding: 50px; border-radius: 30px; border-top: 5px solid var(--acento); text-align: center; max-width: 380px; width: 90%; }
        .btn-login { background: #5865F2; color: white; border: none; padding: 16px; border-radius: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; font-size: 1rem; }
    </style>
</head>
<body id="main-view" class="tema-morado">

    <div id="entry-overlay">
        <h1 style="letter-spacing: 5px; margin-bottom: 30px;">444 STORE</h1>
        <button class="btn-entry" onclick="unlockSystem()">ENTRAR AL SISTEMA</button>
    </div>

    <audio id="phonk-audio" loop preload="auto">
        <source src="https://files.catbox.moe/o3h2v6.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo"><span>444</span> STORE</div>
        <div class="nav-right">
            <div class="selector-box">
                <select class="lang-picker" id="lang-select" onchange="updateLang()">
                    <option value="es">ESP 🇪🇸</option>
                    <option value="en">ENG 🇺🇸</option>
                    <option value="pt">POR 🇵🇹</option>
                </select>
                <div class="color-dots">
                    <div class="dot d-morado" onclick="applyTheme('morado')"></div>
                    <div class="dot d-azul" onclick="applyTheme('azul')"></div>
                    <div class="dot d-rojo" onclick="applyTheme('rojo')"></div>
                    <div class="dot d-amarillo" onclick="applyTheme('amarillo')"></div>
                </div>
            </div>
            <div class="nav-links">
                <a id="nav-home" onclick="location.reload()">Inicio</a>
                <a id="nav-shop">Productos</a>
            </div>
            <a href="https://discord.gg/A3HnywP9" target="_blank" class="discord-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="22" style="filter: invert(1);">
            </a>
        </div>
    </header>

    <div class="container">
        <div id="auth-view">
            <div class="auth-card">
                <h2 id="login-title">ACCESO 444</h2>
                <p id="login-desc" style="color: var(--subtexto);">Vincula tu cuenta para continuar.</p>
                <button class="btn-login" onclick="startLogin()">LOGIN DISCORD</button>
            </div>
        </div>

        <div id="welcome-screen" style="display: none;">
            <img id="user-pfp" src="" class="avatar-glow">
            <h1 class="welcome-text"><span id="txt-greet">HOLA</span>, <span id="user-name"></span></h1>
            <p class="status-msg" id="txt-active">SISTEMA ACTIVO 🔊</p>
        </div>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821"; 
        const REDIRECT_URI = "https://aimdavid-afk.github.io/444-store/";
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1494040311159193733/ekTKj4NBkrejsR2m4G7h3aj64yYVWFXmteloFzTp_62K5h_H973vFxdDhCku6TqbXn5d";

        const translations = {
            es: { home: "Inicio", shop: "Productos", lTitle: "ACCESO 444", lDesc: "Vincula tu cuenta para continuar.", greet: "HOLA", active: "SISTEMA ACTIVO 🔊" },
            en: { home: "Home", shop: "Products", lTitle: "444 ACCESS", lDesc: "Link your account to continue.", greet: "HELLO", active: "SYSTEM ACTIVE 🔊" },
            pt: { home: "Início", shop: "Produtos", lTitle: "ACESSO 444", lDesc: "Vincule sua conta para continuar.", greet: "OLÁ", active: "SISTEMA ATIVO 🔊" }
        };

        // Función para desbloquear música y entrar
        function unlockSystem() {
            const audio = document.getElementById('phonk-audio');
            audio.volume = 0.4;
            audio.play().catch(e => console.log("Audio play error"));
            document.getElementById('entry-overlay').style.display = 'none';
        }

        function applyTheme(color) {
            document.getElementById('main-view').className = 'tema-' + color;
            localStorage.setItem('444_theme', color);
        }

        function updateLang() {
            const lang = document.getElementById('lang-select').value;
            localStorage.setItem('444_lang', lang);
            const t = translations[lang];
            document.getElementById('nav-home').innerText = t.home;
            document.getElementById('nav-shop').innerText = t.shop;
            document.getElementById('login-title').innerText = t.lTitle;
            document.getElementById('login-desc').innerText = t.lDesc;
            document.getElementById('txt-greet').innerText = t.greet;
            document.getElementById('txt-active').innerText = t.active;
        }

        function startLogin() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        }

        async function sendLog(user) {
            const avatar = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : "https://cdn.discordapp.com/embed/avatars/0.png";
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🔔 NUEVO LOGUEO EN 444 STORE",
                        description: `El usuario **${user.username}** (#${user.id}) ha entrado.`,
                        color: 10695679,
                        thumbnail: { url: avatar },
                        timestamp: new Date()
                    }]
                })
            });
        }

        window.onload = async () => {
            const savedColor = localStorage.getItem('444_theme') || 'morado';
            applyTheme(savedColor);
            const savedLang = localStorage.getItem('444_lang') || 'es';
            document.getElementById('lang-select').value = savedLang;
            updateLang();

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                // Si ya viene de Discord, ocultamos el botón de entrada automáticamente
                document.getElementById('entry-overlay').style.display = 'none';
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'block';

                try {
                    const resp = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await resp.json();
                    document.getElementById('user-name').textContent = user.username.toUpperCase();
                    document.getElementById('user-pfp').src = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256` : "https://cdn.discordapp.com/embed/avatars/0.png";
                    
                    // Solo intenta sonar si el audio no ha empezado
                    const audio = document.getElementById('phonk-audio');
                    audio.volume = 0.4;
                    audio.play().catch(() => {
                        // Si falla aquí, mostramos el overlay de nuevo
                        document.getElementById('entry-overlay').style.display = 'flex';
                    });

                    sendLog(user);
                } catch (e) { console.log("Error User"); }
            }
        };
    </script>
</body>
</html>
