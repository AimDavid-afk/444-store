<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --texto: #ffffff;
            --subtexto: #a0a0a0;
            --acento: #a333ff; /* Morado por defecto */
        }

        /* Temas de Color */
        body.tema-azul { --acento: #007bff; }
        body.tema-rojo { --acento: #ff3b3b; }
        body.tema-amarillo { --acento: #ffcc00; }
        body.tema-morado { --acento: #a333ff; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo);
            color: var(--texto); transition: 0.3s; overflow-x: hidden;
        }

        header {
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); transition: 0.3s; }

        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* Selectores de Idioma y Color */
        .selector-container { display: flex; gap: 15px; align-items: center; background: #111; padding: 5px 15px; border-radius: 50px; border: 1px solid #222; }
        
        .lang-select { background: transparent; color: var(--subtexto); border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; outline: none; }
        .lang-select:hover { color: white; }

        .color-dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .dot:hover { transform: scale(1.3); }
        .d-morado { background: #a333ff; }
        .d-azul { background: #007bff; }
        .d-rojo { background: #ff3b3b; }
        .d-amarillo { background: #ffcc00; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: var(--subtexto); text-decoration: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .nav-links a:hover { color: var(--acento); }

        .discord-btn { background: #5865F2; padding: 8px; border-radius: 8px; display: flex; align-items: center; transition: 0.3s; }
        .discord-btn:hover { background: #4752c4; transform: scale(1.1); }

        /* Contenido Central */
        .container { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #welcome-screen { text-align: center; }
        .avatar-glow {
            width: 130px; height: 130px; border-radius: 50%;
            border: 4px solid var(--acento); object-fit: cover;
            box-shadow: 0 0 30px rgba(163, 51, 255, 0.4);
            margin-bottom: 20px; transition: 0.3s;
        }
        .welcome-text { font-size: 3.5rem; font-weight: 800; margin: 0; text-transform: uppercase; }
        .welcome-text span { color: var(--acento); transition: 0.3s; }
        .status { color: #44eb44; font-weight: bold; margin-top: 10px; }

        /* Login Card */
        .auth-card { background: var(--tarjeta); padding: 40px; border-radius: 25px; border-top: 4px solid var(--acento); text-align: center; max-width: 350px; }
        .btn-login { background: #5865F2; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body id="body-main" class="tema-morado">

    <audio id="phonk-audio" loop>
        <source src="https://files.catbox.moe/o3h2v6.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo"><span>444</span> STORE</div>
        
        <div class="nav-right">
            <div class="selector-container">
                <select class="lang-select" id="lang-picker" onchange="cambiarIdioma()">
                    <option value="es">ESP</option>
                    <option value="en">ENG</option>
                    <option value="pt">POR</option>
                </select>
                <div class="color-dots">
                    <div class="dot d-morado" onclick="setTema('morado')"></div>
                    <div class="dot d-azul" onclick="setTema('azul')"></div>
                    <div class="dot d-rojo" onclick="setTema('rojo')"></div>
                    <div class="dot d-amarillo" onclick="setTema('amarillo')"></div>
                </div>
            </div>

            <div class="nav-links">
                <a id="txt-inicio">Inicio</a>
                <a id="txt-productos">Productos</a>
            </div>

            <a href="https://discord.gg/TU_LINK" target="_blank" class="discord-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="20" style="filter: invert(1);">
            </a>
        </div>
    </header>

    <div class="container">
        <div id="auth-section">
            <div class="auth-card">
                <h2 id="txt-auth-title">SISTEMA 444</h2>
                <p id="txt-auth-desc" style="color: var(--subtexto);">Ingresa con tu cuenta de Discord.</p>
                <button class="btn-login" onclick="login()">VINCULAR DISCORD</button>
            </div>
        </div>

        <div id="welcome-screen" style="display: none;">
            <img id="user-avatar" src="" class="avatar-glow">
            <h1 class="welcome-text"><span id="txt-hola">HOLA</span>, <span id="user-tag"></span></h1>
            <p class="status" id="txt-status">SESIÓN INICIADA CORRECTAMENTE ✅</p>
        </div>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821"; 
        const REDIRECT_URI = "https://aimdavid-afk.github.io/444-store/";

        // Traducciones
        const langData = {
            es: { inicio: "Inicio", productos: "Productos", authT: "SISTEMA 444", authD: "Ingresa con tu cuenta de Discord.", hola: "HOLA", status: "SESIÓN INICIADA CORRECTAMENTE ✅" },
            en: { inicio: "Home", productos: "Products", authT: "444 SYSTEM", authD: "Login with your Discord account.", hola: "HELLO", status: "SESSION STARTED SUCCESSFULLY ✅" },
            pt: { inicio: "Início", productos: "Produtos", authT: "SISTEMA 444", authD: "Entre com sua conta do Discord.", hola: "OLÁ", status: "SESSÃO INICIADA COM SUCESSO ✅" }
        };

        function setTema(color) {
            document.getElementById('body-main').className = 'tema-' + color;
            localStorage.setItem('444_color', color);
        }

        function cambiarIdioma() {
            const lang = document.getElementById('lang-picker').value;
            localStorage.setItem('444_lang', lang);
            const t = langData[lang];
            document.getElementById('txt-inicio').innerText = t.inicio;
            document.getElementById('txt-productos').innerText = t.productos;
            document.getElementById('txt-auth-title').innerText = t.authT;
            document.getElementById('txt-auth-desc').innerText = t.authD;
            document.getElementById('txt-hola').innerText = t.hola;
            document.getElementById('txt-status').innerText = t.status;
        }

        function login() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        }

        window.onload = async () => {
            // Cargar preferencias
            const savedColor = localStorage.getItem('444_color') || 'morado';
            setTema(savedColor);
            const savedLang = localStorage.getItem('444_lang') || 'es';
            document.getElementById('lang-picker').value = savedLang;
            cambiarIdioma();

            // Activar música al primer clic
            document.body.addEventListener('click', () => {
                const audio = document.getElementById('phonk-audio');
                audio.volume = 0.3;
                audio.play();
            }, { once: true });

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'block';

                const resp = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const user = await resp.json();
                document.getElementById('user-tag').textContent = user.username.toUpperCase();
                document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256`;
            }
        };
    </script>
</body>
</html>
