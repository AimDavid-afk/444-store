<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --texto: #ffffff;
            --subtexto: #a0a0a0;
            --acento: #a333ff;
        }

        body.tema-azul { --acento: #007bff; }
        body.tema-rojo { --acento: #ff3b3b; }
        body.tema-amarillo { --acento: #ffcc00; }
        body.tema-morado { --acento: #a333ff; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo);
            color: var(--texto); transition: 0.3s; overflow-x: hidden;
        }

        /* Pantalla de Bloqueo Inicial */
        #entry-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--fondo); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .btn-main {
            padding: 18px 45px; background: var(--acento); color: white;
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer;
            font-size: 1.1rem; box-shadow: 0 0 25px var(--acento); transition: 0.3s;
        }

        /* Barra de Navegación */
        header {
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); }

        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-links a { 
            color: var(--subtexto); text-decoration: none; font-size: 0.85rem; 
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--acento); }

        .controls { display: flex; align-items: center; gap: 15px; }
        .selector-box { display: flex; gap: 8px; background: #111; padding: 6px 12px; border-radius: 50px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }

        /* Contenedores de Vista */
        .view-section { display: none; padding: 60px 5% 20px; text-align: center; }
        .view-section.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .avatar-glow {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--acento); box-shadow: 0 0 40px var(--acento);
            margin-bottom: 20px;
        }

        /* Cuadrícula de Productos */
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-top: 40px;
        }
        .product-card {
            background: var(--tarjeta); padding: 20px; border-radius: 15px;
            border: 1px solid #222; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--acento); transform: translateY(-5px); }

        #main-wrapper { display: none; }
    </style>
</head>
<body id="main-view" class="tema-morado">

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/o3h2v6.mp3" type="audio/mpeg">
    </audio>

    <div id="entry-screen">
        <h1 style="letter-spacing: 8px; font-size: 3rem;">444 STORE</h1>
        <p id="entry-status" style="color: var(--subtexto); margin-bottom: 30px;">AUTENTICACIÓN REQUERIDA</p>
        <button id="entry-btn" class="btn-main" onclick="startApp()">VINCULAR DISCORD</button>
    </div>

    <div id="main-wrapper">
        <header>
            <div class="logo"><span>444</span> STORE</div>
            
            <nav class="nav-links">
                <a onclick="showSection('home')" id="nav-home" class="active">INICIO</a>
                <a onclick="showSection('products')" id="nav-products">PRODUCTOS</a>
            </nav>

            <div class="controls">
                <div class="selector-box">
                    <div class="dot d-morado" onclick="applyTheme('morado')"></div>
                    <div class="dot d-azul" onclick="applyTheme('azul')"></div>
                    <div class="dot d-rojo" onclick="applyTheme('rojo')"></div>
                    <div class="dot d-amarillo" onclick="applyTheme('amarillo')"></div>
                </div>
                <a href="https://discord.gg/A3HnywP9" target="_blank" style="background:#5865F2; padding:6px; border-radius:8px; display:flex;">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="20" style="filter: invert(1);">
                </a>
            </div>
        </header>

        <section id="view-home" class="view-section active">
            <img id="user-pfp" src="" class="avatar-glow">
            <h1 style="font-size: 3.5rem; margin: 0;">HOLA, <span id="display-name" style="color:var(--acento)">USUARIO</span></h1>
            <p style="color: #5865F2; font-weight: bold; margin-top: 10px;">SISTEMA ACTIVO ✅ MÚSICA ON</p>
        </section>

        <section id="view-products" class="view-section">
            <h2 style="font-size: 2.5rem;">NUESTROS <span style="color:var(--acento)">PRODUCTOS</span></h2>
            <div class="products-grid">
                <div class="product-card">
                    <div style="height:150px; background:#1a1a1a; border-radius:10px; margin-bottom:15px; display:flex; align-items:center; justify-content:center; color:#444;">IMAGEN PRODUCTO</div>
                    <h3>Producto VIP</h3>
                    <p style="color:var(--subtexto)">Descripción breve del servicio o producto.</p>
                    <button class="btn-main" style="padding:10px 20px; font-size:0.8rem;">COMPRAR</button>
                </div>
                </div>
        </section>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821";
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const WEBHOOK = "https://discord.com/api/webhooks/1494040311159193733/ekTKj4NBkrejsR2m4G7h3aj64yYVWFXmteloFzTp_62K5h_H973vFxdDhCku6TqbXn5d";

        function showSection(sectionId) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            
            document.getElementById('view-' + sectionId).classList.add('active');
            document.getElementById('nav-' + sectionId).classList.add('active');
        }

        function applyTheme(color) {
            document.getElementById('main-view').className = 'tema-' + color;
        }

        function startApp() {
            // Activar música (el clic del usuario lo permite)
            const music = document.getElementById('bg-music');
            music.volume = 0.4;
            music.play();

            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (!token) {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            } else {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('main-wrapper').style.display = 'block';
            }
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                document.getElementById('entry-btn').innerText = "ENTRAR AL SISTEMA";
                document.getElementById('entry-status').innerText = "CONEXIÓN ESTABLECIDA";

                const resp = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const user = await resp.json();

                document.getElementById('display-name').innerText = user.username.toUpperCase();
                document.getElementById('user-pfp').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

                // Log Webhook
                fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "✅ ACCESO EXITOSO",
                            description: `**User:** ${user.username} (${user.id})`,
                            color: 10695679,
                            thumbnail: { url: `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` }
                        }]
                    })
                });
            }
        };
    </script>
</body>
</html>
