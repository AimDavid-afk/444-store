<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Discord System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --acento: #a333ff; 
            --texto: #ffffff;
        }

        .tema-morado { --acento: #a333ff; }
        .tema-azul { --acento: #007bff; }
        .tema-rojo { --acento: #ff3b3b; }
        .tema-amarillo { --acento: #ffcc00; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo); color: var(--texto);
            transition: 0.4s ease;
        }

        header {
            padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo { font-weight: 700; font-size: 1.5rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); }

        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #a0a0a0; text-decoration: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; }

        /* Contenedor del Avatar */
        .user-profile {
            display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 30px;
        }

        #user-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 3px solid var(--acento);
            box-shadow: 0 0 25px rgba(163, 51, 255, 0.4);
            object-fit: cover; display: none; /* Se activa al loguear */
        }

        .container { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .auth-card {
            background: var(--tarjeta); padding: 40px; border-radius: 25px;
            border-top: 4px solid var(--acento); width: 100%; max-width: 380px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .btn-discord {
            background: #5865F2; color: white; border: none; width: 100%;
            padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }
        .btn-discord:hover { background: #4752c4; transform: translateY(-2px); }

        #admin-icon { display: none; width: 28px; cursor: pointer; margin-left: 15px; }
    </style>
</head>
<body id="main-body" class="tema-morado">

    <header>
        <div class="logo"><span>444</span> STORE</div>
        <div class="nav-links">
            <a>INICIO</a> <a>PRODUCTOS</a>
            <img src="https://i.postimg.cc/85M6XvB2/image-15e967.png" id="admin-icon" onclick="alert('Panel Admin')">
        </div>
    </header>

    <div class="container">
        <div id="auth-section">
            <div class="auth-card">
                <h2>BIENVENIDO</h2>
                <p style="color:gray; margin-bottom:30px;">Accede con tu cuenta de Discord</p>
                <button class="btn-discord" onclick="loginDiscord()">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="20">
                    CONECTAR DISCORD
                </button>
            </div>
        </div>

        <div id="welcome-screen" style="display:none; text-align: center;">
            <div class="user-profile">
                <img id="user-avatar" src="" alt="Avatar">
                <h1 style="font-size: 2.5rem; margin:0;">HOLA, <span id="user-tag" style="color:var(--acento)"></span></h1>
                <p style="color:gray;">Sesión iniciada correctamente</p>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821"; 
        const REDIRECT_URI = "https://AimDavid-afk.github.io/444-store/";

        function loginDiscord() {
            const url = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = url;
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'block';

                try {
                    // Obtenemos los datos del usuario desde Discord
                    const resp = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await resp.json();
                    
                    // Mostramos el nombre
                    document.getElementById('user-tag').textContent = user.username.toUpperCase();
                    
                    // Mostramos el Avatar (Logo del usuario)
                    const avatarImg = document.getElementById('user-avatar');
                    if (user.avatar) {
                        const urlAvatar = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256`;
                        avatarImg.src = urlAvatar;
                        avatarImg.style.display = 'block';
                    } else {
                        // Imagen por defecto si no tiene avatar
                        avatarImg.src = "https://cdn.discordapp.com/embed/avatars/0.png";
                        avatarImg.style.display = 'block';
                    }

                    // Mostramos la tuerca (puedes añadir lógica de roles aquí luego)
                    document.getElementById('admin-icon').style.display = 'block';

                } catch (e) {
                    console.error("Error al obtener datos:", e);
                }
            }
        };
    </script>
</body>
</html>
