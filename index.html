<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --texto: #ffffff;
            --subtexto: #a0a0a0;
            --acento: #a333ff;
        }

        body.tema-azul { --acento: #007bff; }
        body.tema-rojo { --acento: #ff3b3b; }
        body.tema-amarillo { --acento: #ffcc00; }
        body.tema-morado { --acento: #a333ff; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo);
            color: var(--texto); transition: 0.3s; overflow: hidden;
        }

        /* Pantalla de Entrada (Obligatoria para Audio y Login) */
        #entry-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--fondo); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        .btn-main {
            padding: 20px 50px; background: var(--acento); color: white;
            border: none; border-radius: 15px; font-weight: 800; cursor: pointer;
            font-size: 1.2rem; box-shadow: 0 0 30px var(--acento); transition: 0.3s;
            text-transform: uppercase; margin-top: 20px;
        }

        header {
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
        }

        .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); }

        .nav-right { display: flex; align-items: center; gap: 20px; }

        .selector-box { 
            display: flex; gap: 12px; background: #111; padding: 8px 15px; border-radius: 50px; 
        }

        .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
        .d-morado { background: #a333ff; }
        .d-azul { background: #007bff; }
        .d-rojo { background: #ff3b3b; }
        .d-amarillo { background: #ffcc00; }

        .container { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .avatar-glow {
            width: 160px; height: 160px; border-radius: 50%;
            border: 4px solid var(--acento); box-shadow: 0 0 40px var(--acento);
            margin-bottom: 25px;
        }

        .welcome-text { font-size: 3.5rem; font-weight: 800; text-transform: uppercase; margin: 0; }
        .welcome-text span { color: var(--acento); }
        .status { color: #5865F2; font-weight: bold; margin-top: 15px; letter-spacing: 1px; }

        #main-content { display: none; } /* Oculto hasta que se logueen */
    </style>
</head>
<body id="main-view" class="tema-morado">

    <audio id="phonk-audio" loop>
        <source src="https://files.catbox.moe/o3h2v6.mp3" type="audio/mpeg">
    </audio>

    <div id="entry-screen">
        <h1 style="font-size: 4rem; margin: 0; letter-spacing: 10px;">444</h1>
        <p id="entry-text" style="color: var(--subtexto);">SISTEMA PRIVADO - REQUIERE AUTENTICACIÓN</p>
        <button id="auth-btn" class="btn-main" onclick="handleAuth()">VINCULAR DISCORD</button>
    </div>

    <div id="main-content">
        <header>
            <div class="logo"><span>444</span> STORE</div>
            <div class="nav-right">
                <div class="selector-box">
                    <div class="dot d-morado" onclick="applyTheme('morado')"></div>
                    <div class="dot d-azul" onclick="applyTheme('azul')"></div>
                    <div class="dot d-rojo" onclick="applyTheme('rojo')"></div>
                    <div class="dot d-amarillo" onclick="applyTheme('amarillo')"></div>
                </div>
                <select id="lang-select" style="background:none; color:white; border:none; cursor:pointer;" onchange="updateLang()">
                    <option value="es">ESP</option>
                    <option value="en">ENG</option>
                    <option value="pt">POR</option>
                </select>
                <a href="https://discord.gg/A3HnywP9" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="25" style="filter: invert(1);">
                </a>
            </div>
        </header>

        <div class="container">
            <img id="user-avatar" class="avatar-glow" src="">
            <h1 class="welcome-text">HOLA, <span id="user-name"></span></h1>
            <p class="status" id="status-text">SESIÓN ACTIVA Y MÚSICA ON ✅</p>
        </div>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821";
        const REDIRECT_URI = "https://aimdavid-afk.github.io/444-store/";
        const WEBHOOK = "https://discord.com/api/webhooks/1494040311159193733/ekTKj4NBkrejsR2m4G7h3aj64yYVWFXmteloFzTp_62K5h_H973vFxdDhCku6TqbXn5d";

        function applyTheme(color) {
            document.getElementById('main-view').className = 'tema-' + color;
            localStorage.setItem('theme', color);
        }

        // Esta función hace el login y activa el audio al mismo tiempo
        function handleAuth() {
            const audio = document.getElementById('phonk-audio');
            audio.play(); // El navegador permite esto porque es respuesta a un clic
            
            // Si ya estamos logueados pero pulsamos el botón de entrar
            const params = new URLSearchParams(window.location.hash.slice(1));
            if (!params.get('access_token')) {
                window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            } else {
                document.getElementById('entry-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                // Cambiamos el texto del botón para que sirva de "Activador de audio"
                document.getElementById('auth-btn').innerText = "ENTRAR AL SISTEMA";
                document.getElementById('entry-text').innerText = "CONEXIÓN EXITOSA CON DISCORD";

                try {
                    const resp = await fetch('https://discord.com/api/users/@me', {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    const user = await resp.json();

                    document.getElementById('user-name').innerText = user.username.toUpperCase();
                    document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

                    // Enviar Log
                    fetch(WEBHOOK, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            embeds: [{
                                title: "👑 ACCESO AL SISTEMA",
                                description: `**Usuario:** ${user.username}\n**ID:** ${user.id}`,
                                color: 10695679,
                                thumbnail: { url: `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` }
                            }]
                        })
                    });
                } catch (e) { console.error("Error cargando usuario"); }
            }
        };
    </script>
</body>
</html>
