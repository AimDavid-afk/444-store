<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --fondo: #050505; --tarjeta: #0d0d0d; --acento: #a333ff; --texto: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background-color: var(--fondo); color: var(--texto); overflow-x: hidden; }
        
        /* Pantalla de Inicio (Necesaria para Música y Logs) */
        #musica-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--fondo); z-index: 9999; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .btn-entrar {
            padding: 20px 45px; background: var(--acento); color: white; 
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px var(--acento); transition: 0.3s; font-size: 1.2rem;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-entrar:hover { transform: scale(1.05); box-shadow: 0 0 40px var(--acento); }

        header { padding: 0.8rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 700; font-size: 1.5rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #a0a0a0; text-decoration: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--acento); }
        
        .container { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--tarjeta); padding: 45px; border-radius: 30px; border-top: 5px solid var(--acento); width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .btn-discord { background: #5865F2; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 1rem; transition: 0.3s; }
        .btn-discord:hover { background: #4752c4; }
        
        #user-avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--acento); box-shadow: 0 0 30px rgba(163, 51, 255, 0.5); object-fit: cover; display: none; margin-bottom: 25px; }
        .empty-msg { color: #1a1a1a; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-top: 60px; text-align: center; display: none; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; max-width: 1150px; margin-top: 40px; }
        #admin-icon { display: none; width: 28px; cursor: pointer; margin-left: 15px; transition: 0.4s; }
        #admin-icon:hover { transform: rotate(90deg); }

        /* Estilo para los productos añadidos */
        .card-p { background: var(--tarjeta); padding: 20px; border-radius: 20px; border: 1px solid #111; text-align: center; }
        .card-p img { width: 100%; border-radius: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="musica-overlay">
        <h1 style="margin-bottom: 10px; letter-spacing: 8px; font-size: 3rem;">444 <span style="font-weight: 400; color:var(--acento);">STORE</span></h1>
        <p style="color: gray; margin-bottom: 30px; font-size: 0.9rem;">REPRODUCIENDO: VOCE NA MIRA (ULTRA SLOWED)</p>
        <button class="btn-entrar" onclick="entrarTienda()">Entrar a la Tienda</button>
    </div>

    <audio id="bg-music" loop>
        <source src="https://cdn.discordapp.com/attachments/1493938564587585586/1493964987675316264/VOCE_NA_MIRA_-__Ultra_Slowed_.mp3?ex=69e0e2d1&is=69df9151&hm=3fd591a55285ab387fed97fa8d5c24fc8c45a66be1080cf16da8f2b068b7301a&" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo"><span>444</span> STORE</div>
        <div class="nav-links">
            <a onclick="irAInicio()">Inicio</a>
            <a onclick="irAProductos()">Productos</a>
            <img src="https://i.postimg.cc/85M6XvB2/image-15e967.png" id="admin-icon" onclick="alert('Modo Admin Activo')">
        </div>
    </header>

    <div class="container">
        <div id="auth-section">
            <div class="auth-card">
                <h2 style="margin-bottom: 10px;">ACCESO RESTRINGIDO</h2>
                <p style="color: gray; margin-bottom: 30px; font-size: 0.85rem;">Debes vincular tu Discord para validar tu identidad.</p>
                <button class="btn-discord" onclick="loginDiscord()">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="20"> VINCULAR DISCORD
                </button>
            </div>
        </div>

        <div id="welcome-screen" style="display:none; text-align: center;">
            <img id="user-avatar" src="">
            <h1 style="font-size: 2.5rem; margin:0;">HOLA, <span id="user-tag" style="color:var(--acento)"></span></h1>
            <p style="color: #5865F2; font-weight: bold; letter-spacing: 1px; margin-top: 10px;">SESIÓN INICIADA CORRECTAMENTE ✅</p>
        </div>

        <section id="shop-section" style="display:none; width:100%;">
            <div id="lista-productos" class="grid-productos"></div>
            <div id="no-products-msg" class="empty-msg">No hay productos disponibles en este momento</div>
        </section>
    </div>

    <script>
        // CONFIGURACIÓN OFICIAL - LINK ACTUALIZADO
        const CLIENT_ID = "1494042607280455821"; 
        const REDIRECT_URI = "https://aimdavid-afk.github.io/444-store/";
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1494040311159193733/ekTKj4NBkrejsR2m4G7h3aj64yYVWFXmteloFzTp_62K5h_H973vFxdDhCku6TqbXn5d";

        function entrarTienda() {
            const audio = document.getElementById('bg-music');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Error audio"));
            document.getElementById('musica-overlay').style.display = 'none';
        }

        function loginDiscord() {
            // Se asegura de que el redirect sea el de GitHub
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');
            
            if (token) {
                // Si vuelve de Discord, cerramos el overlay y cargamos datos
                document.getElementById('musica-overlay').style.display = 'none';
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('welcome-screen').style.display = 'block';
                
                try {
                    const resp = await fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } });
                    const user = await resp.json();
                    
                    document.getElementById('user-tag').textContent = user.username.toUpperCase();
                    const avatarImg = document.getElementById('user-avatar');
                    const urlFoto = user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=256` : "https://cdn.discordapp.com/embed/avatars/0.png";
                    avatarImg.src = urlFoto;
                    avatarImg.style.display = 'block';
                    document.getElementById('admin-icon').style.display = 'block';

                    // ENVIAR LOGS AL WEBHOOK
                    fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            embeds: [{
                                title: "📥 NUEVO LOGUEO EN 444 STORE",
                                description: `El usuario **${user.username}** se ha logueado en la página web.`,
                                color: 10695679,
                                thumbnail: { url: urlFoto },
                                fields: [
                                    { name: "ID Usuario", value: user.id, inline: true },
                                    { name: "Sistema", value: "Web Online", inline: true }
                                ],
                                timestamp: new Date()
                            }]
                        })
                    });

                } catch (e) { console.error("Error cargando perfil"); }
            }
        };

        function irAInicio() {
            document.getElementById('shop-section').style.display = 'none';
            document.getElementById('welcome-screen').style.display = 'block';
        }

        function irAProductos() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('shop-section').style.display = 'block';
            verificarProductos();
        }

        function verificarProductos() {
            const lista = document.getElementById('lista-productos');
            const mensaje = document.getElementById('no-products-msg');
            mensaje.style.display = (lista.children.length === 0) ? 'block' : 'none';
        }
    </script>
</body>
</html>
