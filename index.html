<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>444 Store | Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #050505;
            --tarjeta: #0d0d0d;
            --texto: #ffffff;
            --subtexto: #a0a0a0;
            --acento: #a333ff;
        }

        body.tema-azul { --acento: #007bff; }
        body.tema-rojo { --acento: #ff3b3b; }
        body.tema-amarillo { --acento: #ffcc00; }
        body.tema-morado { --acento: #a333ff; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background-color: var(--fondo);
            color: var(--texto); transition: 0.3s; overflow: hidden;
            user-select: none;
        }

        /* Overlay de inicio para forzar audio */
        #audio-unlock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
        }

        header {
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.95); border-bottom: 1px solid #1a1a1a;
        }

        .logo { font-weight: 800; font-size: 1.6rem; letter-spacing: 2px; }
        .logo span { color: var(--acento); text-shadow: 0 0 10px var(--acento); }

        .selector-box { 
            display: flex; gap: 15px; align-items: center; 
            background: #111; padding: 6px 15px; border-radius: 50px; 
        }

        .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .dot:hover { transform: scale(1.3); }
        .d-morado { background: #a333ff; }
        .d-azul { background: #007bff; }
        .d-rojo { background: #ff3b3b; }
        .d-amarillo { background: #ffcc00; }

        .container { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .avatar-glow {
            width: 150px; height: 150px; border-radius: 50%;
            border: 4px solid var(--acento);
            box-shadow: 0 0 40px var(--acento);
            margin-bottom: 25px;
        }

        .welcome-text { font-size: 3.5rem; font-weight: 800; text-transform: uppercase; }
        .welcome-text span { color: var(--acento); }
        
        .status-tag { 
            color: #5865F2; font-weight: bold; margin-top: 10px; 
            display: flex; align-items: center; gap: 8px;
        }

        .auth-card { background: var(--tarjeta); padding: 40px; border-radius: 20px; border-top: 4px solid var(--acento); text-align: center; }
        .btn-discord { background: #5865F2; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body id="main-view" class="tema-morado">

    <div id="audio-unlock" onclick="startSystem()">
        <h1 style="color:white; letter-spacing: 5px;">CLICK PARA ENTRAR</h1>
        <p style="color:var(--subtexto)">444 STORE SYSTEM</p>
    </div>

    <audio id="bg-audio" loop>
        <source src="https://files.catbox.moe/o3h2v6.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo"><span>444</span> STORE</div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="selector-box">
                <div class="dot d-morado" onclick="applyTheme('morado')"></div>
                <div class="dot d-azul" onclick="applyTheme('azul')"></div>
                <div class="dot d-rojo" onclick="applyTheme('rojo')"></div>
                <div class="dot d-amarillo" onclick="applyTheme('amarillo')"></div>
            </div>
            <a href="https://discord.gg/A3HnywP9" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="30" style="filter: invert(1);">
            </a>
        </div>
    </header>

    <div class="container">
        <div id="auth-view">
            <div class="auth-card">
                <h2>ACCESO REQUERIDO</h2>
                <button class="btn-discord" onclick="login()">CONECTAR DISCORD</button>
            </div>
        </div>

        <div id="welcome-view" style="display: none; text-align: center;">
            <img id="user-avatar" class="avatar-glow" src="">
            <h1 class="welcome-text">HOLA, <span id="user-name"></span></h1>
            <div class="status-tag">SESIÓN INICIADA CORRECTAMENTE ✅</div>
        </div>
    </div>

    <script>
        const CLIENT_ID = "1494042607280455821";
        const REDIRECT_URI = window.location.origin + window.location.pathname; // Detecta automáticamente la URL actual
        const WEBHOOK = "https://discord.com/api/webhooks/1494040311159193733/ekTKj4NBkrejsR2m4G7h3aj64yYVWFXmteloFzTp_62K5h_H973vFxdDhCku6TqbXn5d";

        function startSystem() {
            const audio = document.getElementById('bg-audio');
            audio.volume = 0.4;
            audio.play();
            document.getElementById('audio-unlock').style.display = 'none';
        }

        function applyTheme(color) {
            document.getElementById('main-view').className = 'tema-' + color;
        }

        function login() {
            window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
        }

        window.onload = async () => {
            const params = new URLSearchParams(window.location.hash.slice(1));
            const token = params.get('access_token');

            if (token) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('welcome-view').style.display = 'block';

                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const user = await response.json();

                document.getElementById('user-name').innerText = user.username.toUpperCase();
                document.getElementById('user-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;

                // Log a Discord
                fetch(WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚀 Nuevo Ingreso",
                            description: `El usuario **${user.username}** ha entrado al sistema.`,
                            color: 10695679,
                            thumbnail: { url: `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` }
                        }]
                    })
                });
            }
        };
    </script>
</body>
</html>
